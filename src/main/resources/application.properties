spring.application.name=treino-backend

# El hosting inyecta la variable PORT; en local cae a 8080
server.port=${PORT:8080}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Credenciales por variables de entorno. NUNCA hardcodear aca.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=info

# Origenes permitidos para CORS, separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
